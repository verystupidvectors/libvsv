name: Test *nix build

on:
  push:
    branches: ["master"]
    paths: ["**.c", "**.h"]
  workflow_dispatch:

permissions:
  write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install GCC and friends
        run: sudo apt update && sudo apt install build-essential -y
      - name: Build with GNU make or whatever garbage Canonical bundles, Ubuntu sucks
        run: make
      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          path: |
            'libvsv.so'

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get artifact
        uses: actions/download-artifact@v8
      - name: Rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "continuous" \
                --yes \
                --cleanup-tag \
                --repo "$GITHUB_REPOSITORY" || true
          gh release create "continuous" libvsv.so \
                --title "Rolling release" \
                --target "$GITHUB_SHA" \
                --repo "$GITHUB_REPOSITORY" || true
